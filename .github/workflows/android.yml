name: Android APK

on:
  push:
    branches: [ "main", "mvp-vless-direct" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JPN with Xray
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JPN
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build native Xray library (libXray AAR)
        run: |
          git clone https://github.com/XTLS/libXray.git
          cd libXray
          git checkout 5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LIBXRAY_ANDROID_API=26
          python3 build/main.py android
          mkdir -p ../app/libs
          cp libXray.aar ../app/libs/libXray.aar
          test -s ../app/libs/libXray.aar

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
