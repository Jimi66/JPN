name: Android APK

on:
  push:
    branches: [ "main", "mvp-vless-direct" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JPN with Xray
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JPN
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build native Xray library (libXray AAR)
        run: |
          git clone https://github.com/XTLS/libXray.git
          cd libXray
          git checkout 5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3
          python3 - <<'PY'
          from pathlib import Path

          path = Path("share/validate_outbound.go")
          source = path.read_text()

          replacements = [
              ('\t"reflect"\n', '\t"reflect"\n\t"strings"\n'),
              (
                  '\tvalidOutbounds := make([]conf.OutboundDetourConfig, 0, len(config.OutboundConfigs))\n'
                  '\tfor index := range validationOutbounds {\n'
                  '\t\tif _, err := validationOutbounds[index].Build(); err != nil {\n'
                  '\t\t\tcontinue\n'
                  '\t\t}\n'
                  '\t\tvalidOutbounds = append(validOutbounds, config.OutboundConfigs[index])\n'
                  '\t}\n'
                  '\tif len(validOutbounds) == 0 {\n'
                  '\t\treturn nil, fmt.Errorf("no valid outbound found")\n'
                  '\t}\n',
                  '\tvalidOutbounds := make([]conf.OutboundDetourConfig, 0, len(config.OutboundConfigs))\n'
                  '\tbuildErrorCategories := make(map[string]struct{})\n'
                  '\tfor index := range validationOutbounds {\n'
                  '\t\tif _, err := validationOutbounds[index].Build(); err != nil {\n'
                  '\t\t\tbuildErrorCategories[classifyOutboundBuildError(err)] = struct{}{}\n'
                  '\t\t\tcontinue\n'
                  '\t\t}\n'
                  '\t\tvalidOutbounds = append(validOutbounds, config.OutboundConfigs[index])\n'
                  '\t}\n'
                  '\tif len(validOutbounds) == 0 {\n'
                  '\t\tif len(buildErrorCategories) == 1 {\n'
                  '\t\t\tfor category := range buildErrorCategories {\n'
                  '\t\t\t\treturn nil, fmt.Errorf("no valid outbound found: %s", category)\n'
                  '\t\t\t}\n'
                  '\t\t}\n'
                  '\t\treturn nil, fmt.Errorf("no valid outbound found: Xray rejected the configuration")\n'
                  '\t}\n'
              ),
              (
                  '\treturn config, nil\n'
                  '}\n',
                  '\treturn config, nil\n'
                  '}\n'
                  '\n'
                  '// classifyOutboundBuildError returns only a non-sensitive error category.\n'
                  '// The original Xray error may contain server addresses or credentials.\n'
                  'func classifyOutboundBuildError(err error) string {\n'
                  '\tmessage := strings.ToLower(err.Error())\n'
                  '\tswitch {\n'
                  '\tcase strings.Contains(message, "uuid"), strings.Contains(message, "user id"), strings.Contains(message, "vless id"):\n'
                  '\t\treturn "invalid VLESS identifier"\n'
                  '\tcase strings.Contains(message, "encryption"):\n'
                  '\t\treturn "unsupported VLESS encryption settings"\n'
                  '\tcase strings.Contains(message, "flow"):\n'
                  '\t\treturn "unsupported VLESS flow settings"\n'
                  '\tcase strings.Contains(message, "transport"), strings.Contains(message, "network"), strings.Contains(message, "xhttp"), strings.Contains(message, "splithttp"), strings.Contains(message, "grpc"):\n'
                  '\t\treturn "unsupported or invalid transport settings"\n'
                  '\tcase strings.Contains(message, "port"), strings.Contains(message, "address is not set"), strings.Contains(message, "invalid address"), strings.Contains(message, "invalid domain"):\n'
                  '\t\treturn "invalid server address or port"\n'
                  '\tcase strings.Contains(message, "tls"), strings.Contains(message, "reality"), strings.Contains(message, "security"):\n'
                  '\t\treturn "invalid TLS/Reality settings"\n'
                  '\tdefault:\n'
                  '\t\treturn "Xray rejected the outbound configuration"\n'
                  '\t}\n'
                  '}\n'
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit("Expected libXray source block not found; refusing to modify an unexpected version")
              source = source.replace(old, new, 1)

          path.write_text(source)
          print("Applied safe outbound validation diagnostics")
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path("share/convert_share.go")
          source = path.read_text()
          old = """\tif hasShareSchemeLine(text) {
          \t\tfor raw := range strings.SplitSeq(text, "\\n") {
          \t\t\tline := strings.TrimSpace(raw)
          \t\t\t// Ignore subscription comments and text headers.
          \t\t\tscheme, _, found := strings.Cut(line, "://")
          \t\t\tif !found || strings.ContainsAny(scheme, " \\t#") {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\toutbound, err := parseOutboundShareLink(line)
          \t\t\tif err == nil {
          \t\t\t\tconfig.OutboundConfigs = append(config.OutboundConfigs, *outbound)
          \t\t\t}
          \t\t}
          \t\treturn config, nil
          \t}
          """
          new = """\tif hasShareSchemeLine(text) {
          \t\tparseErrorCategories := make(map[string]struct{})
          \t\tfor raw := range strings.SplitSeq(text, "\\n") {
          \t\t\tline := strings.TrimSpace(raw)
          \t\t\t// Ignore subscription comments and text headers.
          \t\t\tscheme, _, found := strings.Cut(line, "://")
          \t\t\tif !found || strings.ContainsAny(scheme, " \\t#") {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\toutbound, err := parseOutboundShareLink(line)
          \t\t\tif err != nil {
          \t\t\t\tparseErrorCategories[classifyShareParseError(err)] = struct{}{}
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tconfig.OutboundConfigs = append(config.OutboundConfigs, *outbound)
          \t\t}
          \t\tif len(config.OutboundConfigs) == 0 && len(parseErrorCategories) > 0 {
          \t\t\tif len(parseErrorCategories) == 1 {
          \t\t\t\tfor category := range parseErrorCategories {
          \t\t\t\t\treturn nil, fmt.Errorf("no valid share links: %s", category)
          \t\t\t\t}
          \t\t\t}
          \t\t\treturn nil, fmt.Errorf("no valid share links: invalid share-link parameters")
          \t\t}
          \t\treturn config, nil
          \t}
          """
          if old not in source:
              raise SystemExit("Expected share-link parser block not found; refusing to patch unexpected source")
          source = source.replace(old, new, 1)
          marker = "func parseShareCandidates(links string, allowBase64 bool) (*conf.Config, error) {"
          classifier = """// classifyShareParseError emits only safe categories; parser errors may contain credentials.
          func classifyShareParseError(err error) string {
          \tmessage := strings.ToLower(err.Error())
          \tswitch {
          \tcase strings.Contains(message, "uuid"), strings.Contains(message, "user id"), strings.Contains(message, "vless id"):
          \t\treturn "invalid VLESS identifier"
          \tcase strings.Contains(message, "port"), strings.Contains(message, "address"), strings.Contains(message, "domain"), strings.Contains(message, "missing host"):
          \t\treturn "invalid server address or port"
          \tcase strings.Contains(message, "transport"), strings.Contains(message, "network"), strings.Contains(message, "xhttp"), strings.Contains(message, "splithttp"):
          \t\treturn "unsupported or invalid transport settings"
          \tcase strings.Contains(message, "tls"), strings.Contains(message, "reality"), strings.Contains(message, "security"):
          \t\treturn "invalid TLS/Reality settings"
          \tdefault:
          \t\treturn "invalid share-link parameters"
          \t}
          }

          """
          if marker not in source:
              raise SystemExit("Expected share-link parser function not found")
          source = source.replace(marker, classifier + marker, 1)
          if '"fmt"' not in source:
              source = source.replace('"errors"\n', '"errors"\n\t"fmt"\n', 1)
          path.write_text(source)
          print("Applied safe share-link parse diagnostics to convert_share.go")
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path("share/convert_share.go")
          source = path.read_text()
          old = '\treturn nil, errors.New("no valid outbound found")'
          if old not in source:
              raise SystemExit("Expected builder-error masking statement not found")
          source = source.replace(old, '\treturn nil, err', 1)
          path.write_text(source)
          print("Preserved safe classified Xray builder diagnostics")
          PY
          gofmt -w share/validate_outbound.go share/convert_share.go
          grep -q "classifyOutboundBuildError" share/validate_outbound.go
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LIBXRAY_ANDROID_API=26
          python3 build/main.py android
          mkdir -p ../app/libs
          cp libXray.aar ../app/libs/libXray.aar
          test -s ../app/libs/libXray.aar

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
